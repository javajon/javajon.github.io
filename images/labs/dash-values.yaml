# Headlamp chart values for the quickstart labs.
#
# These labs used to install kubernetes/dashboard. That project is retired and its chart
# repository, https://kubernetes.github.io/dashboard/, now answers 404 - so `helm repo add`
# failed and the whole dashboard step was dead for the learner. Headlamp is the CNCF
# project that succeeded it, and is what the rest of these labs already use.

service:
  type: NodePort
  port: 80
  # The lab's dashboard tab points at port 30000 on the session host.
  nodePort: 30000

clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

# Keep Headlamp on the control-plane node.
#
# On these lab images the CNI answers a NodePort only on the node actually running the
# backing Pod, and the browser proxy reaches the control plane. A Pod scheduled onto a
# worker leaves port 30000 dead in the tab.
#
# nodeAffinity with Exists rather than a nodeSelector, because the label's VALUE differs
# between distributions: kubeadm sets node-role.kubernetes.io/control-plane to an empty
# string, k3s sets it to "true". A nodeSelector compares values and would match only one
# of them; Exists matches both.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

# Both taint keys, because these images span Kubernetes versions: kubeadm taints the
# control plane node-role.kubernetes.io/master through 1.23 and
# node-role.kubernetes.io/control-plane from 1.24 on. Tolerating a taint that is not
# present is a no-op.
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
