apiVersion: v1
kind: Pod
metadata:
  name: whoami
spec:
  containers:
    - image: traefik/whoami:v1.12
      name: whoami
      resources:
        requests:
          cpu: "500m"
          memory: "128Mi"
        limits:
          cpu: "1000m"
          memory: "256Mi"
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
