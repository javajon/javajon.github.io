apiVersion: kubekey.kubesphere.io/v1alpha2
kind: Cluster
metadata:
  name: sample
spec:
  # One host, wearing every hat. KubeKey is built to lay clusters down across machines, and
  # the shape of that is in finish.md - the only difference is more entries here and more
  # names under roleGroups.
  hosts:
  - {name: controlplane, address: $CP_NODE_IP, internalAddress: $CP_NODE_IP, user: root}
  roleGroups:
    etcd:
    - controlplane
    control-plane:
    - controlplane
    worker:
    - controlplane
  controlPlaneEndpoint:
    ## Internal loadbalancer for apiservers
    # internalLoadbalancer: haproxy
    domain: controlplane
    address: ""
    port: 6443
  kubernetes:
    version: v1.32.8
    clusterName: cluster.local
  network:
    plugin: calico
    kubePodsCIDR: 10.233.64.0/18
    kubeServiceCIDR: 10.233.0.0/18
    ## multus support. https://github.com/k8snetworkplumbingwg/multus-cni
    multusCNI:
      enabled: false
  registry:
    plainHTTP: false
    privateRegistry: ""
    namespaceOverride: ""
    registryMirrors: []
    insecureRegistries: []
  addons: []
