apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: whoami-deployment
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - image: traefik/whoami:v1.12
        name: whoami
        resources:
          requests:
            cpu: "1000m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
