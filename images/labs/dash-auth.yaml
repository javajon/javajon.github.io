# The service account the learner signs in to Headlamp with.
#
# Kept separate from the chart's own service account so the token script does not depend
# on chart-internal naming. The namespace is headlamp; it was kubernetes-dashboard until
# these labs moved off the retired dashboard project.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: headlamp
