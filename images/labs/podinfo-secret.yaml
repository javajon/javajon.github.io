apiVersion: v1
kind: Pod
metadata:
  name: podinfo-secretive
spec:
  containers:
    - name: podinfo-tls
      image: ghcr.io/stefanprodan/podinfo:6.14.1
      imagePullPolicy: Always
      env:
        - name: SECRET_USERNAME
          valueFrom:
            secretKeyRef:
              name: creds
              key: username
        - name: SECRET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: creds
              key: password
  volumes:
    - name: creds
      secret:
        secretName: db-creds
  