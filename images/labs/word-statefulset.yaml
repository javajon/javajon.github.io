apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: word
  namespace: message-app
spec:
  serviceName: word-service
  replicas: 5
  selector:
    matchLabels:
      app: word
  template:
    metadata:
      labels:
        app: word
    spec:
      containers:
      - name: word
        image: nginx:1.30-alpine
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: word-content
          mountPath: /usr/share/nginx/html
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      initContainers:
      - name: init-word
        image: busybox:1.38
        command:
        - sh
        - -c
        - |
          ORDINAL=${HOSTNAME##*-}
          if [ "$ORDINAL" = "0" ]; then
            echo "If you" > /content/index.html
          elif [ "$ORDINAL" = "1" ]; then
            echo "don't know" > /content/index.html
          elif [ "$ORDINAL" = "2" ]; then
            echo "where you are" > /content/index.html
          elif [ "$ORDINAL" = "3" ]; then
            echo "going, you might" > /content/index.html
          elif [ "$ORDINAL" = "4" ]; then
            echo "wind up someplace else." > /content/index.html
          fi
        volumeMounts:
        - name: word-content
          mountPath: /content
      # emptyDir, not a volumeClaimTemplate.
      #
      # This was a 1Gi ReadWriteOnce claim with no storageClassName, so it needed a default
      # StorageClass with a dynamic provisioner - and this lab installs none. Only tekton
      # and python do. On 2026-08-17 the claim never bound, so word-0 sat Pending, the
      # StatefulSet never started word-1..4, word-service had <none> for endpoints, and a
      # per-Pod DNS name exists only while that Pod IS an endpoint. The assembler duly
      # reported five times over:
      #
      #   [Error: <urlopen error [Errno -2] Name or service not known>]
      #
      # which reads as a broken fix and was nothing of the sort: the solution had already
      # made the Service headless and rewritten the URLs correctly, and both of the
      # verify's declaration checks passed.
      #
      # Nothing here needs persistence. The content is five short strings the initContainer
      # writes at start, regenerated on every restart, and storage is never mentioned
      # anywhere in this lab - the lesson is stable StatefulSet hostnames and headless
      # Services. A volume that outlives the Pod bought nothing and cost the whole lab.
      volumes:
      - name: word-content
        emptyDir: {}