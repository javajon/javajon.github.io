apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-writer
  namespace: kube-system
  labels:
    k8s-app: fluentd-logging
spec:
  selector:
    matchLabels:
      name: log-writer
  template:
    metadata:
      labels:
        name: log-writer
    spec:
      # No tolerations. A control-plane node carries the taint
      # node-role.kubernetes.io/control-plane:NoSchedule, so this DaemonSet lands on
      # the worker Nodes only - which is what you want for a log collector.
      # (Before Kubernetes 1.24 that taint was spelled node-role.kubernetes.io/master.
      # Manifests still carrying the old key tolerate a taint that no longer exists.)
      containers:
      - name: log-writer
        image: busybox:1.37
        args:
          - /bin/sh
          - -c
          - >
            while true;
            do
              echo "$(date) INFO $i" >> /var/log/log-writer.log;
              sleep 5;
            done
        volumeMounts:
          - name: varlog
            mountPath: /var/log
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
